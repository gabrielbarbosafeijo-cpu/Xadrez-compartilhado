<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Xadrez</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Jogo de Xadrez</h1>
  </header>

  <main class="jogo">
    <section class="area-tabuleiro" aria-label="Tabuleiro de xadrez">
      <div id="tabuleiro"></div>
    </section>

    <aside class="painel" aria-label="Painel da partida">
      <p id="vez" class="vez"></p>

      <div id="situacao" class="situacao oculto" role="status" aria-live="polite">
        <strong id="situacaoTitulo"></strong>
        <span id="situacaoDetalhe"></span>
      </div>

      <p id="aviso" class="aviso oculto" role="alert"></p>

      <button id="btnNovaPartida" type="button">Nova partida</button>

      <h2>Histórico</h2>
      <ol id="historico"></ol>
    </aside>
  </main>

  <!-- Menu de promoção: fica escondido até um peão chegar à última fileira -->
  <div id="promocao" class="promocao" hidden>
    <div class="promocao-caixa">
      <p>Escolha a promoção:</p>
      <div id="opcoesPromocao" class="opcoes-promocao"></div>
    </div>
  </div>

  <!-- A ordem importa: cada arquivo usa funções dos anteriores -->
  <script src="js/pieces.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
