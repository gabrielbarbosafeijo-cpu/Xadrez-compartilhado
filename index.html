<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Xadrez</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Jogo de Xadrez</h1>
  </header>

  <main>
    <section>
      <div id="tabuleiro"></div>
    </section>

    <aside>
      <p id="status"></p>
      <p id="aviso"></p>

      <div id="promocao" hidden>
        <p>Escolha a peça da promoção:</p>
        <button type="button" data-tipo="Q">Dama</button>
        <button type="button" data-tipo="R">Torre</button>
        <button type="button" data-tipo="B">Bispo</button>
        <button type="button" data-tipo="N">Cavalo</button>
      </div>

      <button id="btnNovaPartida" type="button">Nova partida</button>
    </aside>
  </main>

  <!-- A ordem importa: cada arquivo usa funções dos anteriores -->
  <script src="js/pecas.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/tela.js"></script>
  <script src="js/jogo.js"></script>
</body>
</html>
